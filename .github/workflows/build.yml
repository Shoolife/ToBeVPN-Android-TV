name: build

on:
  # Direct pushes to main don't ship anything — releases live on tags. PRs
  # still get a sanity build before merge, and workflow_dispatch is kept
  # for manual reruns. This avoids running the full 12-minute signing
  # pipeline twice when we tag a release commit (once for the main push,
  # once for the tag).
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          # libv2ray.aar (~53 MB) is stored via Git LFS to stay under
          # GitHub's 100 MB hard limit. Without lfs: true the checkout
          # gets a tiny pointer file instead of the real binary and the
          # build fails with `zip END header not found`.
          lfs: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 37
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"'

      - name: Restore release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > tobevpn-release.jks
          ls -la tobevpn-release.jks

      - name: Write local.properties
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          # keystore lives at the repo root in CI (we just decoded it
          # there). build.gradle.kts resolves keystore.path through
          # rootProject.file() so a bare `tobevpn-release.jks` lands inside
          # the cloned repo. The local dev convention `../tobevpn-release.jks`
          # only works on a developer machine where the .jks sits one level
          # up alongside the repo clone.
          cat > local.properties <<EOF
          keystore.path=tobevpn-release.jks
          keystore.password=${SIGNING_KEYSTORE_PASSWORD}
          keystore.keyAlias=${SIGNING_KEY_ALIAS}
          keystore.keyPassword=${SIGNING_KEY_PASSWORD}
          EOF

      - name: Build release APK splits
        # APK splits and AAB can't be built in one gradle invocation
        # (Google issuetracker #402800800). Build them separately.
        env:
          BOT_API_URL: ${{ secrets.BOT_API_URL }}
          SUBSCRIPTION_URL: ${{ secrets.SUBSCRIPTION_URL }}
          FALLBACK_BOT_DOMAIN: ${{ secrets.FALLBACK_BOT_DOMAIN }}
          FALLBACK_SUBS_DOMAIN: ${{ secrets.FALLBACK_SUBS_DOMAIN }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build release AAB (no splits)
        # AAB ships every ABI inside one bundle; -PdisableAbiSplits flips
        # splits.abi.isEnable to false for this run.
        env:
          BOT_API_URL: ${{ secrets.BOT_API_URL }}
          SUBSCRIPTION_URL: ${{ secrets.SUBSCRIPTION_URL }}
          FALLBACK_BOT_DOMAIN: ${{ secrets.FALLBACK_BOT_DOMAIN }}
          FALLBACK_SUBS_DOMAIN: ${{ secrets.FALLBACK_SUBS_DOMAIN }}
        run: ./gradlew bundleRelease -PdisableAbiSplits --no-daemon

      - name: Locate and rename artifacts
        # splits {} produces one APK per ABI plus a universal fallback. Rename
        # to ToBeVPN-TV-<version>-<abi>-<sha>.apk — TV-specific prefix so that
        # phone and TV artifacts can coexist on a user's machine without
        # collision. The in-app updater matches by `-<abi>-` substring.
        run: |
          set -e
          VERSION=$(grep -E "^\s*versionName" app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          SHA=${GITHUB_SHA:0:7}

          mkdir -p artifacts
          for apk in app/build/outputs/apk/release/app-*-release.apk; do
            [ -f "$apk" ] || continue
            base=$(basename "$apk" -release.apk)
            abi=${base#app-}
            cp "$apk" "artifacts/ToBeVPN-TV-${VERSION}-${abi}-${SHA}.apk"
          done

          AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -1)
          if [ -z "$AAB" ]; then
            echo "::error::AAB missing"
            ls -R app/build/outputs/
            exit 1
          fi
          cp "$AAB" "artifacts/ToBeVPN-TV-${VERSION}-${SHA}.aab"

          echo "--- artifacts/ ---"
          ls -la artifacts/

          if ! ls artifacts/*.apk >/dev/null 2>&1; then
            echo "::error::no APK splits produced — splits {} block likely misconfigured"
            ls -R app/build/outputs/
            exit 1
          fi

      - name: Upload APK splits
        uses: actions/upload-artifact@v5
        with:
          name: ToBeVPN-TV-apk
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v5
        with:
          name: ToBeVPN-TV-aab
          path: artifacts/*.aab
          if-no-files-found: error

      - name: Wipe sensitive files
        if: always()
        run: |
          rm -f tobevpn-release.jks local.properties

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ToBeVPN-TV-apk/*.apk
            dist/ToBeVPN-TV-aab/*.aab
          generate_release_notes: true
